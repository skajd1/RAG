services:
  backend-api:
    build: ./backend
    container_name: backend-api-dev
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Seoul
      - INGEST_SCHEDULE_TIMEZONE=Asia/Seoul
      - INGEST_SCHEDULE_STATE_FILE=/app/state/.ingest_schedule_state.json
    volumes:
      - ./backend:/app
      - backend_state_dev:/app/state
    # 개발 시에는 소스 코드 변경이 즉시 반영되도록 --reload 옵션 사용
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: always

  frontend-ui:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: frontend-ui-dev
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Seoul
      - BACKEND_INTERNAL_URL=http://backend-api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    # 개발 모드로 실행하여 빌드 오류 방지 및 실시간 반영 활성화
    command: npm run dev
    restart: always

volumes:
  backend_state_dev:
