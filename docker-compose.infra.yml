services:
  qwen-inference:
    image: ollama/ollama:latest
    container_name: qwen-inference
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - TZ=Asia/Seoul
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: always
