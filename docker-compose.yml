services:
  backend-api:
    build: ./backend
    container_name: backend-api
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - INGEST_SCHEDULE_TIMEZONE=Asia/Seoul
      - INGEST_SCHEDULE_STATE_FILE=/app/state/.ingest_schedule_state.json
    volumes:
      - backend_state:/app/state
    ports:
      - "8000:8000"
    restart: always

  frontend-ui:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=/api
    container_name: frontend-ui
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Seoul
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_INTERNAL_URL=http://backend-api:8000
    restart: always

volumes:
  backend_state:
