stages:
  - deploy

deploy-to-103:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p $SERVER_PORT $SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "cd ~/metsabrain && chmod +x ./deploy.sh && ./deploy.sh"
